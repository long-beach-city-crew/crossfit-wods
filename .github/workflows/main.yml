name: Test and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

  deploy:
    needs: test
    # Only deploy main itself, never a pull request's code.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      api_status: ${{ steps.deploy.outputs.api_status }}
      deploy_status: ${{ steps.deploy.outputs.deploy_status }}
    steps:
      - name: Deploy
        id: deploy
        uses: long-beach-city-crew/deploy@main
        with:
          api_host: ${{ secrets.API_HOST }}
          api_key: ${{ secrets.API_KEY }}
          target: ${{ secrets.TARGET }}

  summary:
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Create summary
        shell: bash
        env:
          API_STATUS: ${{ needs.deploy.outputs.api_status || 'n/a' }}
          DEPLOY_STATUS: ${{ needs.deploy.outputs.deploy_status || 'n/a' }}
          RESULT: ${{ needs.deploy.result }}
        run: |
          {
            echo "## Deploy Summary"
            echo
            echo "- Job result: ${RESULT}"
            echo "- API Status: ${API_STATUS}"
            echo "- Deploy Status: ${DEPLOY_STATUS}"
            echo
            echo "_Summary generated automatically._"
          } >> "$GITHUB_STEP_SUMMARY"
